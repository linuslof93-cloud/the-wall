apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wall-db-ingress
spec:
  podSelector:
    matchLabels:
      app: wall-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wall-web
      ports:
        - protocol: TCP
          port: 5432
